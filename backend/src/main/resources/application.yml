spring:
  application:
    name: salu
  datasource:
    url: jdbc:mysql://${SALU_DB_HOST:127.0.0.1}:${SALU_DB_PORT:3307}/salu_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=2000&socketTimeout=3000
    username: ${SALU_DB_USER:salu_app}
    password: ${SALU_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  address: ${SALU_SERVER_HOST:127.0.0.1}
  port: ${SALU_SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: SALU_SESSION
        http-only: true
        same-site: lax
        secure: ${SALU_COOKIE_SECURE:false}
  tomcat:
    max-http-form-post-size: 8KB
  error:
    include-message: never
    include-stacktrace: never
salu:
  photo-root: ${SALU_PHOTO_ROOT}
  backup-key-file: ${SALU_BACKUP_KEY_FILE:}
  backup-key-id: ${SALU_BACKUP_KEY_ID:v1}
  public-origin: ${SALU_PUBLIC_ORIGIN:http://127.0.0.1:5174}
  oauth:
    google-id: ${SALU_GOOGLE_CLIENT_ID:}
    google-secret: ${SALU_GOOGLE_CLIENT_SECRET:}
    naver-id: ${SALU_NAVER_CLIENT_ID:}
    naver-secret: ${SALU_NAVER_CLIENT_SECRET:}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
