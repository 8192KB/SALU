spring:
  application:
    name: salu
  datasource:
    url: jdbc:mysql://${SALU_DB_HOST:127.0.0.1}:${SALU_DB_PORT:3307}/salu_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=2000&socketTimeout=3000
    username: ${SALU_DB_USER:salu_app}
    password: ${SALU_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  sql:
    init:
      mode: never
  mail:
    host: ${SALU_MAIL_HOST:}
    port: ${SALU_MAIL_PORT:587}
    username: ${SALU_MAIL_USERNAME:}
    password: ${SALU_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SALU_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${SALU_MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
server:
  address: ${SALU_SERVER_HOST:127.0.0.1}
  port: ${SALU_SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: SALU_SESSION
        http-only: true
        same-site: lax
        secure: ${SALU_COOKIE_SECURE:false}
  tomcat:
    max-http-form-post-size: 8KB
  error:
    include-message: never
    include-stacktrace: never
salu:
  photo-root: ${SALU_PHOTO_ROOT}
  backup-key-file: ${SALU_BACKUP_KEY_FILE:}
  backup-key-id: ${SALU_BACKUP_KEY_ID:v1}
  public-origin: ${SALU_PUBLIC_ORIGIN:http://127.0.0.1:5174}
  mail-from: ${SALU_MAIL_FROM:}
  payment:
    client-key: ${SALU_TOSS_CLIENT_KEY:}
    secret-key: ${SALU_TOSS_SECRET_KEY:}
  search:
    url: ${SALU_SEARCH_URL:}
    index: ${SALU_SEARCH_INDEX:salu-community-posts}
  ai:
    base-url: ${SALU_AI_BASE_URL:}
    model: ${SALU_AI_MODEL:qwen3:8b}
    api-key: ${SALU_AI_API_KEY:}
    reasoning-effort: ${SALU_AI_REASONING_EFFORT:none}
    temperature: ${SALU_AI_TEMPERATURE:0}
  oauth:
    google-id: ${SALU_GOOGLE_CLIENT_ID:}
    google-secret: ${SALU_GOOGLE_CLIENT_SECRET:}
    naver-id: ${SALU_NAVER_CLIENT_ID:}
    naver-secret: ${SALU_NAVER_CLIENT_SECRET:}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
