name: salu-preview

services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${SALU_DB_NAME:-salu_dev}
      MYSQL_USER: salu_app
      MYSQL_PASSWORD: ${SALU_DB_PASSWORD:?SALU_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${SALU_MYSQL_ROOT_PASSWORD:?SALU_MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: salu-backend:${SALU_IMAGE_TAG:-preview}
    build:
      context: ./backend
    environment:
      SALU_SERVER_HOST: 0.0.0.0
      SALU_SERVER_PORT: 8081
      SALU_DB_HOST: db
      SALU_DB_PORT: 3306
      SALU_DB_USER: salu_app
      SALU_DB_PASSWORD: ${SALU_DB_PASSWORD:?SALU_DB_PASSWORD is required}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${SALU_DB_NAME:-salu_dev}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=2000&socketTimeout=3000
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SALU_COOKIE_SECURE: ${SALU_COOKIE_SECURE:-true}
      SALU_PUBLIC_ORIGIN: ${SALU_PUBLIC_ORIGIN:?SALU_PUBLIC_ORIGIN is required}
      SALU_PHOTO_ROOT: /var/lib/salu/photos
      SALU_BACKUP_KEY_FILE: /run/secrets/backup_keys
      SALU_BACKUP_KEY_ID: ${SALU_BACKUP_KEY_ID:-v1}
      SALU_GOOGLE_CLIENT_ID: ${SALU_GOOGLE_CLIENT_ID:-}
      SALU_GOOGLE_CLIENT_SECRET: ${SALU_GOOGLE_CLIENT_SECRET:-}
      SALU_NAVER_CLIENT_ID: ${SALU_NAVER_CLIENT_ID:-}
      SALU_NAVER_CLIENT_SECRET: ${SALU_NAVER_CLIENT_SECRET:-}
    secrets:
      - backup_keys
    volumes:
      - photos:/var/lib/salu/photos
    tmpfs:
      - /tmp:size=64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
      - outbound
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  web:
    image: salu-web:${SALU_IMAGE_TAG:-preview}
    build:
      context: ./frontend
    networks:
      private:
      proxy:
        aliases:
          - salu-web
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

networks:
  private:
    internal: true
  outbound:
  proxy:
    external: true
    name: ${SALU_PROXY_NETWORK:-nginx-proxy-manager_default}

volumes:
  mysql_data:
  photos:

secrets:
  backup_keys:
    file: ${SALU_BACKUP_KEY_FILE:?SALU_BACKUP_KEY_FILE is required}
