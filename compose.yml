name: salu
services:
  db:
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:${SALU_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: salu_dev
      MYSQL_USER: salu_app
      MYSQL_PASSWORD: ${SALU_DB_PASSWORD:?SALU_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${SALU_MYSQL_ROOT_PASSWORD:?SALU_MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    volumes:
      - salu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D salu_dev -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
volumes:
  salu_mysql_data:
