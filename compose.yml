name: salu
services:
  db:
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:${SALU_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: salu_dev
      MYSQL_USER: salu_app
      MYSQL_PASSWORD: ${SALU_DB_PASSWORD:?SALU_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${SALU_MYSQL_ROOT_PASSWORD:?SALU_MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    volumes:
      - salu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D salu_dev -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  # 커뮤니티 검색(docs/community-api.md `검색 서버`). 필요할 때만 `docker compose --profile search up -d --wait`
  search:
    profiles: ["search"]
    build: ./search
    image: salu-search:8.15.0-nori
    ports:
      - "127.0.0.1:${SALU_SEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      # 로컬 주소에만 열고 앱만 쓰므로 계정·TLS는 끔
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - salu_search_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
volumes:
  salu_mysql_data:
  salu_search_data:
