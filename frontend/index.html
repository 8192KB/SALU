<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f8" />
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('salu.theme');
          if (['system', 'light', 'dark'].includes(saved)) preference = saved;
        } catch {}
        const dark =
          preference === 'dark' ||
          (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#121a19' : '#f7f9f8');
      })();
    </script>
    <meta name="description" content="개인 커트 기록에서 디자이너 상담으로 이어지는 SALU" />
    <title>SALU · 커트 기록에서 다음 커트까지</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- 홈 화면에 추가하면 앱처럼 열림. 오프라인 동작·푸시는 없음 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="SALU" />
    <!-- 카톡·문자에 주소를 붙였을 때 보이는 미리보기. og:image는 nginx가 접속한 주소를 붙여 절대 주소로 바꿈 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SALU" />
    <meta property="og:title" content="SALU · 커트 기록에서 다음 커트까지" />
    <meta property="og:description" content="커트한 날과 이후 변화를 남기고, 디자이너에게 상담해요" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
