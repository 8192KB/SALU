<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f8" />
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('salu.theme');
          if (['system', 'light', 'dark'].includes(saved)) preference = saved;
        } catch {}
        const dark =
          preference === 'dark' ||
          (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#121a19' : '#f7f9f8');
      })();
    </script>
    <meta name="description" content="개인 커트 기록에서 디자이너 상담으로 이어지는 SALU" />
    <title>SALU · 커트 기록에서 다음 커트까지</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
